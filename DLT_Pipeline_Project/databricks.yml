bundle:
  name: DLT_Pipeline_Project
  uuid: 229eba6d-a953-4e65-919f-17726db458de

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
