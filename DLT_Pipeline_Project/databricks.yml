    mode: development
    default: true
    workspace:
      host: https://dbc-3d044c70-07d7.cloud.databricks.com
    variables:
      catalog: dlt_pipeline_project
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-3d044c70-07d7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pavankumar.yellamraju@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pavankumar.yellamraju@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dlt_pipeline_project
      schema: prod
    permissions:
      - user_name: pavankumar.yellamraju@gmail.com
        level: CAN_MANAGE
